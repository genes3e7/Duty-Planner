name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  compile-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pip-tools
        run: pip install pip-tools
      - name: Compile requirements
        run: pip-compile requirements.in --output-file requirements.txt
      - name: Upload Lockfile
        uses: actions/upload-artifact@v4
        with:
          name: lockfiles
          path: requirements.txt
          if-no-files-found: error

  test-matrix:
    needs: compile-deps
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Download Lockfiles
      uses: actions/download-artifact@v4
      with:
        name: lockfiles
        path: .

    - name: Install Dependencies
      run: |
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        else
          pip install -r requirements.in
        fi
        pip install pytest pytest-cov ruff

    - name: Lint and Format (Test Phase)
      run: |
        ruff check --fix .
        ruff format .

    - name: Run Tests
      run: pytest --cov=app tests/

    - name: Create Success Marker
      run: touch python_version_${{ matrix.python-version }}.txt

    - name: Upload Success Marker
      uses: actions/upload-artifact@v4
      with:
        name: success-markers-${{ matrix.python-version }}
        path: python_version_*.txt
        if-no-files-found: error
