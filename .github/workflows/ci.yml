name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write  # Needed for finalize job to push README updates

jobs:
  compile-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-tools
        run: pip install pip-tools
      - name: Compile requirements
        run: pip-compile requirements.in --output-file requirements.txt
      - name: Upload Lockfile
        uses: actions/upload-artifact@v4
        with:
          name: lockfiles
          path: requirements.txt
          if-no-files-found: error

  test-matrix:
    needs: compile-deps
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Download Lockfiles
      uses: actions/download-artifact@v4
      with:
        name: lockfiles
        path: .
      continue-on-error: true

    - name: Install Dependencies
      run: |
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        else
          pip install -r requirements.in
        fi
        pip install pytest pytest-cov

    - name: Ruff Check (Linting)
      run: |
        pip install ruff
        # Run check only (no fix)
        ruff check .
        # Verify formatting without modifying
        ruff format --check .

    - name: Run Tests
      run: pytest --cov=app tests/

    - name: Create Success Marker
      run: touch python_version_${{ matrix.python-version }}.txt

    - name: Upload Success Marker
      uses: actions/upload-artifact@v4
      with:
        name: success-markers
        path: python_version_*.txt

  finalize:
    needs: [test-matrix]
    runs-on: ubuntu-latest
    if: always() && needs.test-matrix.result != 'failure' && needs.test-matrix.result != 'cancelled'
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Success Markers
        uses: actions/download-artifact@v4
        with:
          name: success-markers
          path: artifacts/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update README Badges
        run: |
          # Ensure tools dir exists if not present in repo (for this run)
          mkdir -p tools
          # Logic handled by script, assuming it exists or is created here.
          # We will invoke the script.
          python tools/update_readme.py artifacts/

      - name: Commit and Push
        if: github.event_name == 'push'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ `git status --porcelain README.md` ]]; then
            git add README.md
            git commit -m "docs: update python support badge"
            git push
          else
            echo "No changes to README.md"
          fi
