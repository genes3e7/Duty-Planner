name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  compile-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-tools
        run: pip install pip-tools
      - name: Compile requirements
        run: pip-compile requirements.in --output-file requirements.txt
      - name: Upload Lockfile
        uses: actions/upload-artifact@v4
        with:
          name: lockfiles
          path: requirements.txt

  test-matrix:
    needs: compile-deps
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"] # Removed 3.15

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Download Lockfiles
      uses: actions/download-artifact@v4
      with:
        name: lockfiles
      continue-on-error: true
      id: download-lockfiles

    - name: Check Lockfile Download
      if: steps.download-lockfiles.outcome != 'success'
      run: echo "::warning::Lockfiles not downloaded, using repository files if available"

    - name: Install Dependencies
      run: |
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        else
          pip install -r requirements.in
        fi
        # Install all test/dev dependencies here to ensure they are available
        pip install pytest pytest-cov ruff

    - name: Ruff Format & Fix
      run: |
        ruff check . --fix
        ruff format .

    - name: Run Tests
      run: pytest --cov=app tests/

  finalize:
    needs: [compile-deps, test-matrix]
    runs-on: ubuntu-latest
    # Only run if compile succeeded AND matrix didn't fail
    if: always() && needs.compile-deps.result == 'success' && needs.test-matrix.result != 'failure'
    steps:
      - name: Determine Supported Range
        run: echo "Tests passed across Python 3.12-3.14"
