name: CI

on: [push, pull_request]

permissions:
  contents: write

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Testing a wide range. 3.14 will resolve to alpha/beta if available.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false # Let all versions run to determine the full supported range

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install from requirements.txt (which should be pinned)
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
        pip install pytest

    - name: Test with Pytest
      run: pytest tests.py

    # Record success for this specific matrix job
    - name: Record Success
      if: success()
      run: echo "${{ matrix.python-version }}" > python_version_${{ matrix.python-version }}.txt

    - name: Upload Success Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: passed-version-${{ matrix.python-version }}
        path: python_version_${{ matrix.python-version }}.txt

  finalize-updates:
    needs: test-matrix
    runs-on: ubuntu-latest
    # Always run cleanup/finalize even if some matrix jobs failed (to update range based on what PASSED)
    if: always()
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        pattern: passed-version-*
        merge-multiple: true

    - name: Determine Supported Range
      id: versions
      run: |
        if [ -z "$(ls -A artifacts)" ]; then
           echo "No versions passed! Failing job."
           exit 1
        fi
        
        # Concatenate all version files into one list
        cat artifacts/*.txt > all_versions.txt
        
        # Sort versions using version sort (-V)
        sort -V all_versions.txt -o sorted_versions.txt
        
        MIN_VER=$(head -n 1 sorted_versions.txt)
        MAX_VER=$(tail -n 1 sorted_versions.txt)
        
        echo "Calculated Range: $MIN_VER - $MAX_VER"
        
        echo "MIN_VER=$MIN_VER" >> $GITHUB_ENV
        echo "MAX_VER=$MAX_VER" >> $GITHUB_ENV

    - name: Set up Utility Python (3.13)
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Update README
      run: python tools/update_readme.py "${{ env.MIN_VER }}" "${{ env.MAX_VER }}"

    # Re-compile requirements using the LOWEST supported version to ensure compatibility
    - name: Set up Lowest Python (${{ env.MIN_VER }})
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.MIN_VER }}
        allow-prereleases: true

    - name: Compile requirements.txt
      run: |
        python -m pip install --upgrade pip
        pip install pip-tools
        # Compile requirements.txt from .in if it exists
        if [ -f requirements.in ]; then
          pip-compile requirements.in --output-file requirements.txt --resolver=backtracking
        fi

    # Switch back to utility python for Linting/Formatting
    - name: Set up Python for Linting
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Ruff Format & Fix
      run: |
        pip install ruff
        ruff check . --fix
        ruff format .

    # Verify PyInstaller build still works after all changes
    - name: Verify Builder (PyInstaller)
      run: |
        pip install pyinstaller
        pip install -r requirements.txt
        python build.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add .
        
        if git diff --staged --quiet; then
          echo "No changes to commit."
        else
          git commit -m "chore: update supported versions (${{ env.MIN_VER }}-${{ env.MAX_VER }}) and code style"
          # Explicitly push to the PR branch
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
        fi
