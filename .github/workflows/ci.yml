name: CI

on:
  push:
    # Trigger on all pushes, filter inside jobs
  pull_request:
    # Trigger on all PRs, filter inside jobs

permissions:
  contents: write

jobs:
  # JOB 1: Detect what actually changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          python:
            - '**.py'
            - 'requirements.txt'
            - 'requirements.in'
            - 'pyproject.toml'
            # Note: .github/workflows/ci.yml is deliberately EXCLUDED from this list.
            # Changes to CI config will NOT trigger the heavy test matrix.

  # JOB 2: Run Matrix (Only if Python files changed)
  test-matrix:
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
        pip install pytest

    - name: Test with Pytest
      run: pytest tests/

    - name: Record Success
      if: success()
      run: echo "${{ matrix.python-version }}" > python_version_${{ matrix.python-version }}.txt

    - name: Upload Success Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: passed-version-${{ matrix.python-version }}
        path: python_version_${{ matrix.python-version }}.txt

  # JOB 3: Finalize (Update Readme, Lint, Commit)
  # Runs only if matrix ran (and maybe failed), OR if we forced it.
  # Here we skip it if 'python' files didn't change, because there's nothing to update/lint.
  finalize-updates:
    needs: [test-matrix, changes]
    runs-on: ubuntu-latest
    # Run only if python files changed (matrix ran). 'always()' is needed to run even if matrix failed (to catch partial successes).
    if: always() && needs.changes.outputs.python == 'true'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        pattern: passed-version-*
        merge-multiple: true

    - name: Determine Supported Range
      id: versions
      run: |
        if [ -z "$(ls -A artifacts)" ]; then
           echo "No versions passed! Failing job."
           exit 1
        fi
        
        cat artifacts/*.txt > all_versions.txt
        sort -V all_versions.txt -o sorted_versions.txt
        
        MIN_VER=$(head -n 1 sorted_versions.txt)
        MAX_VER=$(tail -n 1 sorted_versions.txt)
        
        echo "Calculated Range: $MIN_VER - $MAX_VER"
        
        echo "MIN_VER=$MIN_VER" >> $GITHUB_ENV
        echo "MAX_VER=$MAX_VER" >> $GITHUB_ENV

    - name: Set up Utility Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Update README
      run: python tools/update_readme.py "${{ env.MIN_VER }}" "${{ env.MAX_VER }}"

    - name: Set up Lowest Python (${{ env.MIN_VER }})
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.MIN_VER }}
        allow-prereleases: true

    - name: Compile requirements.txt
      run: |
        python -m pip install --upgrade pip
        pip install pip-tools
        if [ -f requirements.in ]; then 
          pip-compile requirements.in --output-file requirements.txt --resolver=backtracking
        fi

    - name: Set up Python for Linting
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Ruff Format & Fix
      run: |
        pip install ruff
        ruff check . --fix
        ruff format .

    - name: Verify Builder (PyInstaller)
      run: |
        pip install pyinstaller
        pip install -r requirements.txt
        python build.py

    - name: Commit and Push changes
      env:
        PR_BRANCH: ${{ github.head_ref || github.ref_name }}
        MIN_VER: ${{ env.MIN_VER }}
        MAX_VER: ${{ env.MAX_VER }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add .
        
        if git diff --staged --quiet; then
          echo "No changes to commit."
        else
          # Build a dynamic list of what changed
          CHANGES=""
          
          # Check if README changed (implies version update)
          if git diff --staged --name-only | grep -q "README.md"; then
            CHANGES="$CHANGES, versions ($MIN_VER-$MAX_VER)"
          fi
          
          # Check if requirements changed
          if git diff --staged --name-only | grep -q "requirements.txt"; then
            CHANGES="$CHANGES, deps"
          fi
          
          # Check if Python files changed (implies linting/formatting)
          if git diff --staged --name-only | grep -q ".py$"; then
            CHANGES="$CHANGES, formatting"
          fi
          
          # Clean up the leading comma/space
          CHANGES=$(echo "$CHANGES" | sed 's/^, //')
          
          # Fallback message
          if [ -z "$CHANGES" ]; then
            CHANGES="misc updates"
          fi
          
          git commit -m "chore: CI auto-update ($CHANGES)"
          git push origin HEAD:"$PR_BRANCH"
        fi
