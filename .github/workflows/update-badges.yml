name: Update Badges & Fixes

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: write

jobs:
  update-badges:
    runs-on: ubuntu-latest
    # Security: Only run if the PR/Branch belongs to this repository (no forks)
    if: >
      github.event.workflow_run.conclusion == 'success' && 
      github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      # 1. Checkout Trusted Code (Main Branch) to get safe scripts
      - name: Checkout Trusted Scripts
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted_code

      # 2. Checkout Target Branch (The one we want to update)
      - name: Checkout Target Branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_branch }}
          path: repo_content
          token: ${{ secrets.GITHUB_TOKEN }}

      # 3. Download Artifacts
      - name: Download Success Markers
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: repo_content/artifacts/

      # 4. Debugging: Check if artifacts actually arrived
      - name: Debug Artifacts
        run: |
          echo "Listing artifacts directory:"
          ls -R repo_content/artifacts/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tools
        run: pip install ruff

      # 5. Apply Fixes & Updates
      - name: Apply Fixes and Update Badges
        working-directory: ./repo_content
        run: |
          # Run Linting (Check only, fixes should be done in CI or locally to avoid confusion)
          # We only format here to ensure the badge update commit is clean
          ruff format .
          
          # Run Badge Update Script (using the SAFE version from main)
          # We pass the relative path to artifacts
          python ../trusted_code/tools/update_readme.py artifacts/

      # 6. Commit and Push (Explicitly targeting the branch)
      - name: Commit and Push Updates
        working-directory: ./repo_content
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check for changes
          if [[ -z $(git status --porcelain) ]]; then
            echo "No changes to commit."
            exit 0
          fi
          
          echo "Changes detected. Committing..."
          git add .
          
          # Determine Commit Message
          MSG="chore: auto-update from CI [skip ci]"
          if [[ -n $(git status --porcelain README.md) ]]; then
            MSG="docs: update python support badge [skip ci]"
          fi

          git commit -m "$MSG"
          
          # PUSH explicitly to the branch we checked out
          BRANCH_NAME="${{ github.event.workflow_run.head_branch }}"
          echo "Pushing to $BRANCH_NAME..."
          git push origin HEAD:$BRANCH_NAME
