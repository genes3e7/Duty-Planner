name: Update Badges & Fixes

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: write

jobs:
  update-badges:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      # 1. Checkout Trusted Code (Main Branch)
      # We need this to run the SAFE version of tools/update_readme.py
      - name: Checkout Trusted Scripts
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted_code

      # 2. Checkout Target Branch (The one we want to update)
      - name: Checkout Target Branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_branch }}
          path: repo_content
          token: ${{ secrets.GITHUB_TOKEN }}

      # 3. Download Artifacts from the Triggering Workflow
      - name: Download Success Markers
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: repo_content/artifacts/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linting Tools
        run: pip install ruff

      # 4. Apply Fixes on the Target Branch
      - name: Re-apply Linting Fixes
        working-directory: ./repo_content
        run: |
          ruff check --fix .
          ruff format .

      # 5. Run Trusted Update Script
      # We run the script from 'trusted_code' against the files in 'repo_content'
      - name: Update README Badges
        working-directory: ./repo_content
        run: |
          # The script expects artifacts dir as arg 1 and looks for README.md in CWD
          python ../trusted_code/tools/update_readme.py artifacts/

      - name: Commit and Push Updates
        working-directory: ./repo_content
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          README_CHANGED=false
          CODE_CHANGED=false
          
          if [[ -n $(git status --porcelain README.md) ]]; then
            README_CHANGED=true
          fi
          
          if [[ -n $(git status --porcelain | grep -v "README.md") ]]; then
            CODE_CHANGED=true
          fi
          
          MSG=""
          if [ "$README_CHANGED" = true ] && [ "$CODE_CHANGED" = true ]; then
            MSG="chore: update python support badge and apply lint fixes"
          elif [ "$README_CHANGED" = true ]; then
            MSG="docs: update python support badge"
          elif [ "$CODE_CHANGED" = true ]; then
            MSG="style: apply lint fixes"
          fi
          
          if [ -n "$MSG" ]; then
            git add .
            git commit -m "$MSG [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
