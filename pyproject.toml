# pyproject.toml

[tool.ruff]
# Target Python 3.10 (lowest in CI matrix) to ensure compatibility across 3.10 - 3.14
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# E = Error, F = Pyflakes, I = Import Sorting
select = ["E", "F", "I"]

[tool.pytest.ini_options]
# testpaths tells pytest where to look when run without arguments
testpaths = ["tests"]
# Ensure it looks for the correct file pattern
python_files = ["test_*.py"]
