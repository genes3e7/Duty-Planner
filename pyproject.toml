[project]
name = "duty-planner"
version = "0.1.0"
description = "A Streamlit-based application for scheduling staff duties."
authors = [{ name = "Duty Planner Contributors" }]
requires-python = ">=3.12"
dependencies = [
    "holidays",
    "openpyxl",
    "ortools",
    "pandas",
    "pydantic",
    "streamlit",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.15.14",
    "vulture>=2.10",
    "interrogate>=1.5.0",
    "pathspec>=0.12.1",
]

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["artifacts*", "tests*", "tools*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = []

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra --cov-fail-under=95"
testpaths = ["tests"]
python_files = "test_*.py"

[tool.interrogate]
ignore-init-module = true
ignore-init-method = true
ignore-private = true
ignore-semiprivate = false
ignore-magic = true
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = false
ignore-setters = false
fail-under = 100
exclude = ["setup.py", "tests", "build", "tools", "dist", ".venv"]
ignore-regex = ["^get$", "^mock_.*", ".*Base$"]
verbose = 0
quiet = false
whitelist-regex = []
color = true



